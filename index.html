<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulting Services Procurement Scheduler (RA 9184)</title>
    <link rel="icon" type="image/png" href="tup_logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" id="printArea">
      <h1>Technological University of the Philippines - Manila</h1>
      <h1>Consulting Services Procurement Scheduler</h1>
      <h2>Based on 2016 Revised IRR of RA 9184 – Annex “C”</h2>

      <!-- ✅ Project Information Section -->
      <div class="project-info">
        <label for="projectTitle">Project Title:</label>
        <input
          type="text"
          id="projectTitle"
          placeholder="Enter project title"
        />

        <label for="projectBudget"
          >Approved Budget for the Contract (ABC):</label
        >
        <input
          type="text"
          id="projectBudget"
          placeholder="Enter amount (e.g. 1000000 or ₱1,000,000.00)"
        />
      </div>

      <div class="input-section">
        <label for="startActivity">Starting Activity:</label>
        <select id="startActivity">
          <option value="0">Pre-Procurement Conference</option>
          <option value="1">
            Advertisement/Posting of Request for Expression of Interest
          </option>
          <option value="2">Eligibility Check and Shortlisting</option>
        </select>

        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" />

        <!-- ✅ Added Start Time Picker -->
        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime" />

        <label for="holidayPicker">Add Holiday (single):</label>
        <input type="date" id="holidayPicker" />
        <button id="addHolidayBtn">➕ Add Holiday</button>

        <div id="holidayList"></div>
      </div>

      <!-- Buttons Row -->
      <div class="button-row">
        <button id="generateBtn">📅 Generate Schedule</button>
        <button id="printBtn" class="secondary">🖨 Print / Export PDF</button>
        <button id="saveHolidaysBtn">💾 Save Holidays</button>
        <input type="file" id="loadHolidaysFile" accept=".json" />
        <button id="loadHolidaysBtn">📂 Load Holidays</button>
      </div>

      <!-- ✅ Project Details Display Area (included in print) -->
      <div id="displayProjectDetails" class="display-details"></div>

      <div class="table-container">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th>Procurement Activity</th>
              <th>Min Days</th>
              <th>Max Days</th>
              <th>Adjust (+ Days)</th>
              <th>Adjusted Date</th>
              <th>Total Calendar Days</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="5" style="text-align: right">
                <strong>Total Calendar Days:</strong>
              </td>
              <td id="totalDays">0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
